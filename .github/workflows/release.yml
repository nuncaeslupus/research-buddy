name: Release

# Tag-triggered release: pushing a `vX.Y.Z` tag runs the full CI, checks the
# tag against pyproject.toml and CHANGELOG.md, builds, publishes to PyPI
# (trusted publishing / OIDC) and cuts a GitHub release. Nothing is published
# on a plain merge to `main`; see RELEASE.md for the procedure.
#
# Keep this workflow filename as `release.yml` — the PyPI trusted-publisher
# config is keyed to repo + workflow filename + the `pypi` environment.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# Serialise releases so two quick tag pushes can't race into a double publish.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Full CI (lint + tests on every supported Python) on the tagged commit.
  ci:
    name: CI on the tagged commit
    uses: ./.github/workflows/ci.yml

  # Every check that can reject a release runs here, before anything is
  # published: tag/version agreement, ancestry on main, CHANGELOG entry.
  build:
    name: Verify and build distributions
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dev extras
        run: uv sync --extra dev

      - name: Tag commit must be on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "Tag $GITHUB_REF_NAME is not on main — refusing to release." >&2
            exit 1
          }

      - name: Tag must match pyproject.toml version
        run: |
          VER=$(uv run python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          if [ "$GITHUB_REF_NAME" != "v$VER" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pyproject.toml version $VER." >&2
            exit 1
          fi
          echo "VER=$VER" >> "$GITHUB_ENV"

      - name: Verify version strings in sync
        run: make check-version-sync

      - name: Extract release notes from CHANGELOG.md
        run: |
          python3 << 'EOF'
          import re, os, pathlib, sys
          ver = os.environ["VER"]
          text = pathlib.Path("CHANGELOG.md").read_text()
          pattern = r"(?m)^## \[" + re.escape(ver) + r"\].*?(?=^## \[|\Z)"
          m = re.search(pattern, text, re.DOTALL)
          if not m:
              print(f"No CHANGELOG entry for {ver}", file=sys.stderr)
              sys.exit(1)
          pathlib.Path("release-notes.md").write_text(m.group().strip())
          EOF

      - name: Build wheel and sdist
        run: make build

      - name: Twine metadata check
        run: uv run twine check dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error
          retention-days: 7

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Required for PyPI trusted publishing (OIDC); no API token needed.
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create GitHub release
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@v8
        with:
          name: release-notes
      - name: Create release for the pushed tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            dist/*
